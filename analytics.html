
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics | StudentSpace</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-white shadow-sm px-4">
        <a class="navbar-brand fw-bold" href="dashboard.html">🎓 StudentSpace</a>

        <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="dashboard.html">Dashboard</a>
                <a class="nav-link" href="students.html">Students</a>
                <a class="nav-link" href="courses.html">Courses</a>
                <a class="nav-link" href="results.html">Results</a>
                <a class="nav-link active" href="analytics.html">Analytics</a>
                <a class="nav-link" href="profile.html">Profile</a>
                <a class="nav-link text-danger" href="index.html"
                    onclick="localStorage.removeItem('loggedIn')">Logout</a>
            </div>
        </div>
    </nav>

    <main class="container py-4">

        <h3 class="fw-bold">Academic Analytics</h3>
        <p class="text-muted">Explore student performance statistics.</p>

        <div class="row g-3 mt-3">

            <div class="col-md-6">
                <div class="card border-0 shadow-sm p-4 h-100">
                    <h5 class="fw-bold">Grade Distribution</h5>
                    <p class="text-muted small">Number of students by grade.</p>
                    <canvas id="gradeChart"></canvas>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card border-0 shadow-sm p-4 h-100">
                    <h5 class="fw-bold">Student Performance</h5>
                    <p class="text-muted small">GPA comparison by student.</p>
                    <canvas id="gpaChart"></canvas>
                </div>
            </div>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/app.js"></script>

</body>
</html>
