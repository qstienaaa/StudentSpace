
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses | StudentSpace</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-white shadow-sm px-4">
        <a class="navbar-brand fw-bold" href="dashboard.html">🎓 StudentSpace</a>

        <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="dashboard.html">Dashboard</a>
                <a class="nav-link" href="students.html">Students</a>
                <a class="nav-link active" href="courses.html">Courses</a>
                <a class="nav-link" href="results.html">Results</a>
                <a class="nav-link" href="analytics.html">Analytics</a>
                <a class="nav-link" href="profile.html">Profile</a>
                <a class="nav-link text-danger" href="index.html"
                    onclick="localStorage.removeItem('loggedIn')">Logout</a>
            </div>
        </div>
    </nav>

    <main class="container py-4">

        <h3 class="fw-bold">Course Management</h3>
        <p class="text-muted">View available academic courses.</p>

        <div class="card border-0 shadow-sm p-3 mt-4">

            <h5 class="fw-bold mb-3">Course Records</h5>

            <input
                type="text"
                id="courseSearch"
                class="form-control mb-3"
                placeholder="Search by Course ID or Course Name..."
            >

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Course ID</th>
                            <th>Course Name</th>
                            <th>Credit Hours</th>
                            <th>Faculty</th>
                        </tr>
                    </thead>

                    <tbody id="courseTable"></tbody>
                </table>
            </div>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/app.js"></script>

    <script>
        const searchInput = document.getElementById("courseSearch");
        const courseRows = document.getElementById("courseTable");

        searchInput.addEventListener("input", function () {
            const searchValue = this.value.toLowerCase();
            const rows = courseRows.querySelectorAll("tr");

            rows.forEach(row => {
                const courseId = row.cells[0]?.textContent.toLowerCase() || "";
                const courseName = row.cells[1]?.textContent.toLowerCase() || "";

                row.style.display =
                    courseId.includes(searchValue) ||
                    courseName.includes(searchValue) ? "" : "none";
            });
        });
    </script>

</body>
</html>
