
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | StudentSpace</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-white shadow-sm px-4">
        <a class="navbar-brand fw-bold" href="dashboard.html">🎓 StudentSpace</a>

        <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <div class="navbar-nav ms-auto">
                <a class="nav-link active" href="dashboard.html">Dashboard</a>
                <a class="nav-link" href="students.html">Students</a>
                <a class="nav-link" href="course.html">Courses</a>
                <a class="nav-link" href="results.html">Results</a>
                <a class="nav-link" href="analytics.html">Analytics</a>
                <a class="nav-link" href="profile.html">Profile</a>
                <a class="nav-link" href="announcement.html">Announcements</a>
                <a class="nav-link text-danger" href="index.html"
                    onclick="localStorage.removeItem('loggedIn')">Logout</a>
            </div>
        </div>
    </nav>

    <main class="container py-4">

        <h3 class="fw-bold">Dashboard</h3>
        <p class="text-muted">Welcome to StudentSpace Management System.</p>

        <div class="row g-3 mt-2">

            <div class="col-md-4">
                <div class="card border-0 shadow-sm p-4">
                    <p class="text-muted mb-2">Total Students</p>
                    <h2 class="fw-bold" id="totalStudents">0</h2>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card border-0 shadow-sm p-4">
                    <p class="text-muted mb-2">Total Courses</p>
                    <h2 class="fw-bold" id="totalCourses">0</h2>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card border-0 shadow-sm p-4">
                    <p class="text-muted mb-2">Average GPA</p>
                    <h2 class="fw-bold" id="averageGPA">0.00</h2>
                </div>
            </div>

        </div>

        <div class="card border-0 shadow-sm p-4 mt-4">
            <h5 class="fw-bold mb-3">Student Performance Overview</h5>
            <canvas id="performanceChart"></canvas>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/app.js"></script>

</body>
</html>
