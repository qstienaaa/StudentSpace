
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | StudentSpace</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-white shadow-sm px-4">
        <a class="navbar-brand fw-bold" href="dashboard.html">🎓 StudentSpace</a>

        <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="dashboard.html">Dashboard</a>
                <a class="nav-link" href="students.html">Students</a>
                <a class="nav-link" href="courses.html">Courses</a>
                <a class="nav-link" href="results.html">Results</a>
                <a class="nav-link" href="analytics.html">Analytics</a>
                <a class="nav-link active" href="profile.html">Profile</a>
                <a class="nav-link text-danger" href="index.html"
                    onclick="localStorage.removeItem('loggedIn')">Logout</a>
            </div>
        </div>
    </nav>

    <main class="container py-4">

        <h3 class="fw-bold">My Profile</h3>
        <p class="text-muted">View your account information.</p>

        <div class="card border-0 shadow-sm p-4 mt-4">

            <div class="text-center mb-4">
                <div class="brand-icon">👩🏻‍🎓</div>
                <h4 class="fw-bold mt-3">Administrator</h4>
                <p class="text-muted mb-0">StudentSpace User</p>
                <span class="badge bg-success mt-2">Active Account</span>
            </div>

            <hr>

            <h5 class="fw-bold mb-4">Account Information</h5>

            <div class="row mb-3">
                <div class="col-sm-4 text-muted">Username</div>
                <div class="col-sm-8 fw-semibold">admin</div>
            </div>

            <hr>

            <div class="row mb-3">
                <div class="col-sm-4 text-muted">Role</div>
                <div class="col-sm-8 fw-semibold">Administrator</div>
            </div>

            <hr>

            <div class="row mb-3">
                <div class="col-sm-4 text-muted">System Name</div>
                <div class="col-sm-8 fw-semibold">StudentSpace</div>
            </div>

            <hr>

            <div class="row mb-3">
                <div class="col-sm-4 text-muted">Account Status</div>
                <div class="col-sm-8 fw-semibold text-success">Active</div>
            </div>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/app.js"></script>
